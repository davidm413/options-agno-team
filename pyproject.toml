[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "regime-trader"
version = "0.1.0"
description = "AI-native deterministic market regime intelligence and options workflow service."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Option Trading System" }]
dependencies = [
  "agno>=2.2.0",
  "mcp>=1.10.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "publicdotcom-py>=0.1.15",
  "pyarrow>=16.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "redis>=5.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.13.0",
  "SQLAlchemy>=2.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
regime-trader = "regime_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_trader"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["regime_trader"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
  "agno.*",
  "mcp.*",
  "pandas.*",
  "public_api_sdk.*",
  "redis.*",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: opt-in tests that require live provider or external services",
]
