[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-agno-team"
version = "0.1.0"
description = "AI-native market regime and options strategy system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
options-agno = "options_agno_team.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
public = ["publicdotcom-py>=0.1.15"]
mcp = ["mcp>=1.23.0"]
agno = ["agno>=2.3.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
